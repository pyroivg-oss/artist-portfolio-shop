<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1><i class="fas fa-globe"></i> Global Time Clock</h1>
            <p>Real-time display of current time across multiple time zones</p>
        </header>

        <!-- Controls -->
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search timezone..." class="search-input">
                <i class="fas fa-search"></i>
            </div>
            
            <div class="format-controls">
                <label class="toggle-label">
                    <input type="checkbox" id="format24h" checked>
                    <span class="toggle-switch"></span>
                    <span class="toggle-text">24-hour format</span>
                </label>
                
                <button class="btn btn-primary" id="addTimezoneBtn">
                    <i class="fas fa-plus"></i> Add Timezone
                </button>
                
                <button class="btn btn-secondary" id="resetBtn">
                    <i class="fas fa-redo"></i> Reset
                </button>
            </div>
        </div>

        <!-- Clocks Grid -->
        <div class="clocks-grid" id="clocksContainer">
            <!-- Clocks will be inserted here -->
        </div>

        <!-- No Results Message -->
        <div class="no-results" id="noResults" style="display: none;">
            <i class="fas fa-search"></i>
            <p>No timezones match your search</p>
        </div>
    </div>

    <!-- Add Timezone Modal -->
    <div class="modal" id="addTimezoneModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Timezone</h2>
                <button class="modal-close" id="closeModalBtn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <input type="text" id="timezoneSearchInput" placeholder="Search timezone..." class="modal-input">
                <div class="timezone-list" id="timezoneList">
                    <!-- Timezones will be listed here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script src="timezones.js"></script>
    <script src="script.js"></script>
</body>
</html>
